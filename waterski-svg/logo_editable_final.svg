<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1600" viewBox="0 0 1600 1600">
  <title>Федерация воднолыжного спорта Рязанской области</title>
  <desc>Редактируемый SVG. Знак состоит из векторных контуров, текст оставлен текстом, градиенты векторные.</desc>

  <defs>
    <linearGradient id="navyGradient" x1="250" y1="250" x2="1180" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#041B45"/>
      <stop offset="0.55" stop-color="#062C67"/>
      <stop offset="1" stop-color="#0A4A9B"/>
    </linearGradient>
    <linearGradient id="blueGradient" x1="300" y1="760" x2="1230" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0759C7"/>
      <stop offset="1" stop-color="#1497FF"/>
    </linearGradient>
    <linearGradient id="redGradient" x1="300" y1="860" x2="1230" y2="860" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8172B"/>
      <stop offset="1" stop-color="#FF2436"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="1600" fill="#FFFFFF"/>

  <!-- голова -->
  <circle cx="807" cy="250" r="48" fill="url(#navyGradient)"/>

  <!-- фал -->
  <path d="M230 342 L506 378 L642 384" fill="none" stroke="#062655" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="506" cy="378" r="15" fill="#062655"/>
  <path d="M506 378 L639 452" fill="none" stroke="#062655" stroke-width="8" stroke-linecap="round"/>
  <path d="M642 386 L666 348 L738 348 L700 438 Z" fill="#FFFFFF" stroke="#062655" stroke-width="13" stroke-linejoin="round"/>

  <!-- минималистичный райдер -->
  <path d="M686 382
           C760 383 828 375 895 338
           C895 392 875 455 836 518
           C790 593 721 669 614 732
           C739 697 858 652 1081 557
           C1113 543 1149 559 1164 588
           C1177 615 1161 651 1129 657
           C956 663 790 700 610 782
           C685 674 765 570 832 486
           C871 437 887 397 892 360
           C831 386 761 393 686 382 Z"
        fill="url(#navyGradient)"/>

  <!-- верхняя доска, цельная линия соприкосновения -->
  <path d="M250 759
           C346 842 490 866 666 837
           C828 810 976 744 1138 676
           C1164 665 1199 675 1213 696
           C1227 718 1217 748 1190 759
           C1003 790 828 835 651 905
           C499 964 341 957 251 890
           C205 856 205 805 250 759 Z"
        fill="url(#navyGradient)"/>

  <!-- белый просвет -->
  <path d="M283 824
           C381 887 511 896 666 867
           C821 838 964 783 1128 720
           C973 769 833 815 681 848
           C518 884 384 884 283 824 Z"
        fill="#FFFFFF"/>

  <!-- синяя волна -->
  <path d="M287 903
           C431 955 593 949 749 917
           C895 887 1028 839 1187 780
           C1036 831 907 869 773 897
           C604 932 444 932 287 884 Z"
        fill="url(#blueGradient)"/>

  <!-- красная волна -->
  <path d="M307 985
           C462 1027 629 1014 784 979
           C923 947 1048 904 1214 842
           C1066 895 935 934 801 965
           C628 1006 462 1006 307 963 Z"
        fill="url(#redGradient)"/>

  <!-- текст: остаётся редактируемым -->
  <text x="800" y="1210"
        text-anchor="middle"
        fill="#062655"
        font-family="TT Supermolot Neue Expanded ExtraBold Italic, TT Supermolot Neue ExtraBold Italic, TT Supermolot Neue, Arial Black, sans-serif"
        font-size="164"
        font-weight="800"
        font-style="italic"
        letter-spacing="1">ФЕДЕРАЦИЯ</text>

  <path d="M165 1288 L260 1288" fill="none" stroke="url(#blueGradient)" stroke-width="9" stroke-linecap="round"/>
  <path d="M1340 1288 L1435 1288" fill="none" stroke="url(#redGradient)" stroke-width="9" stroke-linecap="round"/>

  <text x="800" y="1315"
        text-anchor="middle"
        fill="#062655"
        font-family="TT Supermolot Neue Expanded Bold Italic, TT Supermolot Neue Bold Italic, TT Supermolot Neue, Arial Black, sans-serif"
        font-size="72"
        font-weight="700"
        font-style="italic"
        letter-spacing="1">ВОДНОЛЫЖНОГО СПОРТА</text>

  <text x="800" y="1415"
        text-anchor="middle"
        fill="#062655"
        font-family="Montserrat Medium, Montserrat, Arial, sans-serif"
        font-size="52"
        font-weight="500"
        letter-spacing="20">РЯЗАНСКОЙ ОБЛАСТИ</text>
</svg>
